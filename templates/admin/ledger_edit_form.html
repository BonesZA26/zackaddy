{% extends 'admin/base.html' %}{% block title %}Edit private ledger draft{% endblock %}{% block content %}<section class="admin-panel"><p class="eyebrow">Private / editable</p><h1>Edit ledger draft.</h1><p>This record remains private until you deliberately publish it. After publication it becomes immutable.</p><form method="post" class="admin-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Public ID<input name="public_id" required maxlength="40" value="{{ entry.public_id }}"></label><label>Record date<input type="date" name="record_date" required value="{{ entry.record_date }}"></label><label>Type<input name="record_type" required maxlength="40" value="{{ entry.record_type }}"></label><label>Status<input name="status" required maxlength="40" value="{{ entry.status }}"></label><label class="admin-wide">Summary<input name="summary" required maxlength="240" value="{{ entry.summary }}"></label><label class="admin-wide">Claim / full record<textarea name="claim" maxlength="4000">{{ entry.claim or '' }}</textarea></label><label>Reason / note<textarea name="reason" maxlength="2000">{{ entry.reason or '' }}</textarea></label><label>Receipt type<input name="receipt_type" maxlength="80" value="{{ entry.receipt_type or '' }}"></label><label>Receipt reference<input name="receipt_reference" maxlength="200" value="{{ entry.receipt_reference or '' }}"></label><label>Receipt amount<input name="receipt_amount" maxlength="80" value="{{ entry.receipt_amount or '' }}"></label><label>Receipt content ID<input name="receipt_content_id" maxlength="200" value="{{ entry.receipt_content_id or '' }}"></label><label>Receipt URL<input type="url" name="receipt_url" maxlength="1000" value="{{ entry.receipt_url or '' }}"></label><label>Source label<input name="source_label" maxlength="200" value="{{ entry.source_label or '' }}"></label><label class="admin-wide">Source URL<input type="url" name="source_url" maxlength="1000" value="{{ entry.source_url or '' }}"></label><div class="admin-wide"><button class="button button-primary" type="submit">Save private draft</button> <a class="button button-secondary" href="{{ url_for('admin_dashboard') }}">Cancel</a></div></form></section>{% endblock %}
