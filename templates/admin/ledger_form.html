{% extends 'admin/base.html' %}{% block title %}New ledger record{% endblock %}{% block content %}<section class="admin-panel"><p class="eyebrow">Additive public record</p><h1>New ledger record.</h1><p>Save a draft or publish it. A published record cannot be edited or deleted.</p><form method="post" class="admin-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Public ID<input name="public_id" required maxlength="40" placeholder="ZA-001"></label><label>Record date<input type="date" name="record_date" required></label><label>Type<input name="record_type" required maxlength="40" placeholder="work, payment, study, refusal"></label><label>Status<input name="status" required maxlength="40" placeholder="filed, landed, declined"></label><label class="admin-wide">Summary<input name="summary" required maxlength="240"></label><label class="admin-wide">Claim / full record<textarea name="claim" maxlength="4000"></textarea></label><label>Corrects published record<select name="corrects_id"><option value="">No — standalone record</option>{% for row in originals %}<option value="{{ row.id }}">{{ row.public_id }} — {{ row.summary }}</option>{% endfor %}</select></label><label>Reason / refusal note<textarea name="reason" maxlength="2000"></textarea></label><label>Receipt type<input name="receipt_type" maxlength="80"></label><label>Receipt reference<input name="receipt_reference" maxlength="200"></label><label>Receipt amount<input name="receipt_amount" maxlength="80"></label><label>Receipt content ID<input name="receipt_content_id" maxlength="200"></label><label>Receipt URL<input type="url" name="receipt_url" maxlength="1000"></label><label>Source label<input name="source_label" maxlength="200"></label><label class="admin-wide">Source URL<input type="url" name="source_url" maxlength="1000"></label><label class="admin-check"><input type="checkbox" name="publish" value="yes"> Publish immediately (permanent)</label><div class="admin-wide"><button class="button button-primary" type="submit">Create record</button></div></form></section>{% endblock %}
