<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Admin{% endblock %} — Zack Addy</title><link rel="stylesheet" href="{{ url_for('static',filename='css/base.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/admin.css') }}"></head>
<body class="admin-page"><header class="admin-header"><a href="{{ url_for('admin_dashboard') }}">Zack Addy / Private admin</a>{% if g.admin %}<div class="admin-account"><a class="button button-secondary" href="{{ url_for('admin_change_password') }}">Change password</a><form method="post" action="{{ url_for('admin_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button button-secondary" type="submit">Sign out</button></form></div>{% endif %}</header><main class="admin-main">{% for category,message in get_flashed_messages(with_categories=true) %}<p class="admin-alert admin-alert-{{ category }}">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
