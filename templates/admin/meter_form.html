{% extends 'admin/base.html' %}{% block title %}New Meter snapshot{% endblock %}{% block content %}<section class="admin-panel admin-narrow"><p class="eyebrow">Dated, not live</p><h1>New Meter snapshot.</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>As of<input type="date" name="snapshot_date" required></label><label>Runway<input name="runway" required maxlength="120"></label><label>Burn<input name="burn" required maxlength="120"></label><label>In flight<input name="in_flight" required maxlength="240"></label><label>Note<textarea name="note" maxlength="1000"></textarea></label><label class="admin-check"><input type="checkbox" name="publish" value="yes"> Publish immediately (permanent)</label><button class="button button-primary" type="submit">Create snapshot</button></form></section>{% endblock %}
