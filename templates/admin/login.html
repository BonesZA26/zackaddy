{% extends 'admin/base.html' %}{% block title %}Sign in{% endblock %}{% block content %}
<section class="admin-panel admin-narrow">
<p class="eyebrow">Private administration</p>
<h1>Sign in.</h1>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Username<input name="username" required maxlength="80" autocomplete="username"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button class="button button-primary" type="submit">Sign in</button>
</form>
<p><a href="{{ url_for('admin_recover') }}">Lost access? Use a one-time recovery code.</a></p>
</section>
{% endblock %}
